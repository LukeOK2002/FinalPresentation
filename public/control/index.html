<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>Control · Thesis presentation</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: var(--font); }
    main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    h1 { margin: 0; font-size: 22px; }
    .card { padding: 18px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline); display: flex; flex-direction: column; gap: 12px; }
    .card h2 { margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-2); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 13px; color: var(--text-2); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .muted { color: var(--text-2); font-size: 14px; margin: 0; line-height: 1.45; }
    input[type=password] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--bg); color: var(--text); font: 16px var(--font); }
    button { padding: 11px 16px; border-radius: 10px; border: 0; font: 600 15px var(--font); cursor: pointer; background: var(--text); color: var(--bg); }
    button.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--hairline); }
    button.danger { background: transparent; color: #ff8a80; box-shadow: inset 0 0 0 1px #5a2a2a; }
    .switch { position: relative; width: 52px; height: 30px; padding: 0; border-radius: 99px; background: var(--surface-3); }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text-2); transition: transform 200ms var(--ease-out), background-color 200ms; }
    .switch[aria-checked="true"] { background: #2f7a55; }
    .switch[aria-checked="true"]::after { transform: translateX(22px); background: #fff; }
    .err { color: #ff8a80; min-height: 1.2em; margin: 0; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Presenter control</h1>

    <form id="login" class="card">
      <h2>Password</h2>
      <input type="password" name="pw" autocomplete="current-password" placeholder="Presenter password" required>
      <p class="err" id="login-err" aria-live="polite"></p>
      <button type="submit">Unlock</button>
    </form>

    <div id="panel" hidden>
      <div class="card">
        <div class="row"><h2>Room</h2><span class="muted" id="conn">Connecting…</span></div>
        <div class="stats">
          <div class="stat"><b id="s-dev">0</b><span>phones (cap <span id="s-cap">50</span>)</span></div>
          <div class="stat"><b id="s-n">0</b><span>rounds pooled</span></div>
          <div class="stat"><b id="s-p">–</b><span>2/2 · TSD signal</span></div>
        </div>
        <p class="muted" id="s-split"></p>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <h2>TSD simulator on phones</h2>
            <p class="muted">Opens automatically when the deck (in <code>?present</code> mode) reaches the simulation slide.</p>
          </div>
          <button class="switch" id="open-tsd" role="switch" aria-checked="false" aria-label="Simulator open on phones"></button>
        </div>
      </div>

      <div class="card">
        <h2>Reset</h2>
        <p class="muted">Do this after rehearsing, right before the talk.</p>
        <div class="row" style="justify-content:flex-start;flex-wrap:wrap">
          <button class="ghost" id="reset-results">Reset results</button>
          <button class="danger" id="reset-all">Reset everything</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../config.js"></script>
  <script type="module" src="control.js"></script>
</body>
</html>
