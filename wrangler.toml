# One Worker serves everything: slides (/), phone page (/join/), control page
# (/control/) and the live-sync WebSocket (/ws). Deploy: `npx wrangler deploy`.
# Your URL will be https://<name>.<your-account>.workers.dev (free).
name = "thesis-live"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true    # serve on the free <name>.<subdomain>.workers.dev address
preview_urls = false  # no per-upload preview links

[assets]
directory = "./public"
binding = "ASSETS"

# The single "room" every device connects to.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Object => runs on the Workers FREE plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
CAP = "50" # max phones in the room

# PRESENTER_PW is a secret, never stored here. Set it once with:
#   npx wrangler secret put PRESENTER_PW
# For local `wrangler dev`, copy .dev.vars.example to .dev.vars.
